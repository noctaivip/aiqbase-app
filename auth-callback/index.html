<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIQ Base — подтверждение Email</title><style>body{margin:0;background:#07172b;color:#eef7ff;font:16px system-ui,Arial;display:grid;place-items:center;min-height:100vh}.card{max-width:440px;margin:24px;padding:28px;border-radius:22px;background:#102643;border:1px solid #28517a;text-align:center}h1{font-size:24px}p{line-height:1.55;color:#c9d9ea}button{background:#38c9e8;border:0;border-radius:12px;padding:15px 24px;color:#062035;font-size:16px;font-weight:700;cursor:pointer;width:100%}.hint{font-size:13px}</style></head><body><main class="card"><h1>AIQ Base</h1><p id="status">Подтверждение завершено. Открываем приложение…</p><button id="open" type="button">Открыть AIQ Base</button><p class="hint">Если приложение не открылось автоматически, нажмите кнопку. Убедитесь, что AIQ Base установлен.</p></main><script>(function(){'use strict';var q=new URLSearchParams(location.search),h=new URLSearchParams(location.hash.slice(1));var status=document.getElementById('status');var keys=['access_token','refresh_token','token_type','expires_in','expires_at','type','code','error','error_code','error_description'];var target=new URL('app.aiqbase://auth-callback');for(var i=0;i<keys.length;i++){var k=keys[i],v=h.get(k)||q.get(k);if(v)target.searchParams.set(k,v)}if(q.get('error')||h.get('error'))status.textContent='Не удалось подтвердить Email: '+(q.get('error_description')||h.get('error_description')||'Ссылка недействительна или устарела.');else if(!target.searchParams.has('code')&&!target.searchParams.has('access_token'))status.textContent='Ссылка открыта без данных авторизации. Откройте новое письмо подтверждения.';var url=target.href;document.getElementById('open').addEventListener('click',function(){location.href=url});if(!target.searchParams.has('error')&&(target.searchParams.has('code')||target.searchParams.has('access_token')))setTimeout(function(){location.href=url},350);})();</script></body></html>
